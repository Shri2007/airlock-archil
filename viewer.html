<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airlock: round viewer</title>
<!--
  Reads results.json (written by run_airlock.py) and replays the search round by
  round. Keys: R replay, S skip to the end, 0 latest run, 1-4 demo scenarios
  (demo_results/<n>.json, made by `python3 demo.py all`). Add ?instant=1 to skip
  the animation. Dark only on purpose: this is a projector screen.
  The two pixel critters are original art: green = Airlock, red = the rogue tool.
-->
<style>
  :root {
    --bg: #0a0f0d; --panel: #111815; --line: #24302b; --ink: #e9f1ec; --mute: #8b9a92;
    --dim: #50605a; --green: #3ddc84; --green-deep: #0f3b25; --red: #ff4d5e; --red-deep: #4a1219;
    --s1: #b9c26a; --s2: #f2b84b; --s3: #f58f3c; --s4: #f4623f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  body { min-height: 100dvh; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 18px 28px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 20px; height: 44px; }
  .mark { font-family: var(--sans); font-weight: 800; font-size: 26px; letter-spacing: .14em; }
  .mark b { color: var(--green); }
  .tag { color: var(--mute); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .keys { display: flex; gap: 6px; flex-shrink: 0; }
  #replay { flex-shrink: 0; }
  .key { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .key:hover { border-color: var(--mute); }
  .key:active { transform: translateY(1px); }
  .key[aria-pressed="true"] { border-color: var(--green); color: var(--green); }
  .key:focus-visible, .tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* arena */
  .arena { display: grid; grid-template-columns: 190px minmax(0, 1fr) 190px; align-items: center; gap: 24px;
           border: 1px solid var(--line); background: var(--panel); padding: 14px 26px; position: relative; overflow: hidden; }
  .arena::after { content: ""; position: absolute; inset: 0; background: var(--red); opacity: 0; pointer-events: none; }
  .arena.flash::after { animation: flash .5s ease-out; }
  .fighter { display: grid; justify-items: center; gap: 10px; }
  .fighter svg { width: 132px; height: 99px; shape-rendering: crispEdges; }
  .fighter .name { font-size: 13px; letter-spacing: .16em; color: var(--mute); text-align: center; }
  .f-green { color: var(--green); } .f-red { color: var(--red); }
  .f-green svg { animation: bob 1.6s steps(2) infinite; }
  .f-red svg { animation: bob 1.6s steps(2) infinite .8s; }
  .f-green.jab svg { animation: jabR .38s ease-out; }
  .f-red.jab svg { animation: jabL .38s ease-out; }
  .f-green.lunge svg { animation: jabR .5s ease-out; }
  .f-red.lunge svg { animation: lungeL .55s ease-out; }
  .fighter.hit svg { animation: hit .42s steps(4); }
  .fighter.block svg { animation: block .32s ease-out; }
  .fighter.ko svg { animation: none; transform: rotate(90deg) scale(.8); opacity: .35; transition: transform .5s cubic-bezier(.3,1.4,.5,1), opacity .5s; }
  .fighter.win svg { animation: hop .7s cubic-bezier(.3,1.4,.5,1) 3; }
  .fighter.tired svg { animation: none; opacity: .45; transform: translateY(8px); transition: all .5s; }
  .mid { display: grid; gap: 10px; justify-items: center; min-width: 0; }
  .phase { font-family: var(--sans); font-weight: 800; font-size: 34px; letter-spacing: .06em; line-height: 1.1; }
  .phase small { font-family: var(--mono); font-weight: 400; font-size: 15px; color: var(--mute); letter-spacing: .1em; margin-left: 12px; }
  .meter { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--mute); letter-spacing: .08em; }
  .meter .segs { display: flex; gap: 4px; }
  .meter .segs i { width: 46px; height: 12px; background: var(--line); transition: background .2s; }
  .caption { font-size: 17px; min-height: 24px; text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caption.bad { color: var(--red); } .caption.good { color: var(--green); }

  /* main */
  .main { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
  .rounds { position: relative; display: grid; gap: 12px; }
  .rounds svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .links path { fill: none; stroke: var(--dim); stroke-width: 1.5; opacity: 0; transition: opacity .3s; }
  .links path.on { opacity: .8; } .links path.bad { stroke: var(--red); }
  .round { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 12px; align-items: stretch; opacity: .25; transition: opacity .3s; }
  .round.on { opacity: 1; }
  .rlabel { border-left: 3px solid var(--line); padding: 6px 0 6px 12px; display: grid; align-content: center; gap: 4px; }
  .rlabel b { font-family: var(--sans); font-size: 18px; letter-spacing: .05em; white-space: nowrap; }
  .rlabel span { font-size: 12px; color: var(--mute); letter-spacing: .14em; }
  .round[data-phase="shrink"] .rlabel { border-color: var(--green); }
  .round[data-phase="climb"] .rlabel { border-color: var(--s2); }
  .tiles { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 12px; position: relative; z-index: 1; }
  .tile { border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0;
          opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .3s cubic-bezier(.16,1,.3,1), background .25s, border-color .25s; }
  .tile.on { opacity: 1; transform: none; }
  .tile.s5 { background: var(--red-deep); border-color: var(--red); }
  .tile.safe { border-color: #2c5a41; }
  .tile.scene { box-shadow: inset 0 0 0 2px var(--red); }
  .thead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tid { font-size: 18px; font-weight: 700; white-space: nowrap; }
  .how { min-width: 0; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .how b { color: var(--ink); font-weight: 600; }
  .bar { display: flex; gap: 3px; }
  .bar i { flex: 1; height: 9px; background: var(--line); }
  .knobs { display: flex; gap: 3px; flex-wrap: wrap; }
  .knobs i { font-style: normal; font-size: 10px; padding: 2px 4px; border: 1px solid var(--line); color: var(--dim); letter-spacing: .04em; }
  .knobs i.onk { color: var(--ink); border-color: var(--mute); }
  .knobs i.flip { border-color: var(--s2); color: var(--s2); }
  .dense .tile { padding: 6px 10px; gap: 5px; } .dense .knobs { display: none; } .dense .rounds { gap: 8px; }

  /* verdict */
  .side { border: 1px solid var(--line); background: var(--panel); padding: 20px; display: grid; gap: 18px; position: sticky; top: 16px; }
  .count { font-family: var(--sans); font-weight: 800; font-size: 60px; line-height: 1; letter-spacing: -.02em; }
  .count span { color: var(--mute); font-size: 30px; font-weight: 600; }
  .count #tested { color: var(--ink); font-size: 60px; font-weight: 800; }
  .sub { color: var(--mute); font-size: 14px; margin-top: 6px; line-height: 1.45; }
  .map { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }
  .map i { aspect-ratio: 1; background: #17201c; transition: background .25s; }
  .map i.scene { outline: 2px solid var(--ink); outline-offset: 1px; }
  .h { font-size: 12px; letter-spacing: .16em; color: var(--mute); margin: 0 0 8px; text-transform: uppercase; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
  .chip { font-size: 15px; padding: 6px 10px; border: 1px solid var(--red); color: var(--ink); background: var(--red-deep); animation: pop .3s cubic-bezier(.3,1.5,.5,1); }
  .chip.no { border-color: var(--line); background: transparent; color: var(--mute); text-decoration: line-through; }
  .chip.none { border-color: var(--green); background: var(--green-deep); color: var(--green); }
  .verdict { font-family: var(--sans); font-weight: 700; font-size: 22px; line-height: 1.25; }
  .verdict.safe { color: var(--green); }
  .facts { display: grid; gap: 8px; font-size: 13.5px; line-height: 1.45; color: var(--mute); }
  .facts b { color: var(--ink); font-weight: 600; } .facts .ok { color: var(--green); } .facts .warn { color: var(--s2); }
  .facts code { color: var(--ink); background: #17201c; padding: 1px 5px; }
  .late { opacity: 0; transition: opacity .5s; } .late.on { opacity: 1; }
  .state { padding: 60px 20px; text-align: center; color: var(--mute); font-size: 17px; line-height: 1.6; }
  .state code { color: var(--ink); }

  @keyframes bob { 50% { transform: translateY(-4px); } }
  @keyframes jabR { 40% { transform: translateX(34px); } }
  @keyframes jabL { 40% { transform: translateX(-34px); } }
  @keyframes lungeL { 35% { transform: translateX(-90px) scale(1.12); } }
  @keyframes hit { 25% { transform: translate(-7px, 2px); filter: brightness(2.2); } 50% { transform: translate(7px, -2px); } 75% { transform: translate(-4px, 0); } }
  @keyframes block { 50% { transform: scale(1.08); filter: brightness(1.5); } }
  @keyframes hop { 40% { transform: translateY(-22px); } }
  @keyframes flash { 0% { opacity: .38; } 100% { opacity: 0; } }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 980px) {
    .main { grid-template-columns: 1fr; } .side { position: static; }
    .top { height: auto; flex-wrap: wrap; gap: 10px; } .keys { flex-wrap: wrap; flex-shrink: 1; } .wrap { padding: 14px 16px 24px; }
    .arena { grid-template-columns: 90px 1fr 90px; padding: 12px; gap: 10px; } .fighter svg { width: 80px; height: 60px; } .fighter .name { font-size: 10px; letter-spacing: .04em; }
    .phase { font-size: 22px; } .phase small { display: block; margin: 4px 0 0; } .meter .segs i { width: 26px; }
    .round { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tag { display: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="mark">AIR<b>LOCK</b></div>
    <div class="tag" id="tag">Forks a machine many ways to find exactly when an AI tool leaks your secrets.</div>
    <div class="keys" id="keys" role="group" aria-label="Which run to show"></div>
    <button class="key" id="replay" title="Replay (R)">Replay</button>
  </header>

  <section class="arena" id="arena" aria-label="Airlock versus the tool under test">
    <div class="fighter f-green" id="fg"><svg viewBox="0 0 12 9" aria-hidden="true"></svg><div class="name">AIRLOCK</div></div>
    <div class="mid">
      <div class="phase" id="phase">LOADING</div>
      <div class="meter"><span>CLOSEST TO BETRAYAL</span><span class="segs" id="meter"><i></i><i></i><i></i><i></i><i></i></span><span id="meterN">0/5</span></div>
      <div class="caption" id="caption" role="status" aria-live="polite"></div>
    </div>
    <div class="fighter f-red" id="fr"><svg viewBox="0 0 12 9" aria-hidden="true"></svg><div class="name" id="rname">ROGUE TOOL</div></div>
  </section>

  <div class="main">
    <section class="rounds" id="rounds" aria-label="Search rounds"><div class="state">Loading results.json</div></section>
    <aside class="side" id="side" aria-label="Result">
      <div>
        <div class="count"><span id="tested">0</span><span> / <span id="space">64</span></span></div>
        <div class="sub" id="countSub">possible worlds tested</div>
      </div>
      <div><p class="h">All 64 worlds</p><div class="map" id="map"></div></div>
      <div><p class="h">Betrays only when</p><div class="chips" id="trig"></div></div>
      <div><p class="h">Does not matter</p><div class="chips" id="irr"></div></div>
      <div class="late" id="late">
        <div class="verdict" id="verdict"></div>
        <div class="facts" id="facts" style="margin-top:12px"></div>
      </div>
    </aside>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const SCORE_COLOR = ['', 'var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--red)'];
const SHORT = { injected: 'INJ', authority: 'AUTH', few_issues: 'FEW', secret: 'SEC', network: 'NET', ci_config: 'CI' };
const params = new URLSearchParams(location.search);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let instant = params.has('instant') || reduce;
let data = null, runToken = 0, tiles = {}, current = '0';

/* ---- pixel critters (original art) ---- */
const SPRITE = ['..##....##..', '.##########.', '############', '###o####o###', '############', '############', '.##########.', '.#..#..#..#.', '.#..#..#..#.'];
function drawSprite(svg, angry) {
  const ns = 'http://www.w3.org/2000/svg';
  SPRITE.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === '.') return;
    const r = document.createElementNS(ns, 'rect');
    r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', 1.02); r.setAttribute('height', 1.02);
    const brow = angry && y === 2 && (x === 4 || x === 7);
    r.setAttribute('fill', c === 'o' || brow ? '#0a0f0d' : 'currentColor');
    svg.appendChild(r);
  }));
}
drawSprite($('fg').querySelector('svg'), false);
drawSprite($('fr').querySelector('svg'), true);
function act(who, cls, ms = 520) {
  if (instant) return;
  const f = $(who); f.classList.remove('jab', 'lunge', 'hit', 'block'); void f.offsetWidth; f.classList.add(cls);
  setTimeout(() => f.classList.remove(cls), ms);
}
const sleep = ms => instant ? Promise.resolve() : new Promise(r => setTimeout(r, ms));

/* ---- data ---- */
function normalize(d) {
  if (!d || typeof d !== 'object') throw new Error('results.json is not an object.');
  if (!Array.isArray(d.rounds)) {
    if (!Array.isArray(d.environments)) throw new Error('results.json has no rounds.');
    d.rounds = [{ round: 0, phase: 'grid', envs: d.environments.map(e => ({ score: e.verdict === 'BLOCK' ? 5 : 0, ...e })) }];
  }
  d.knobs = d.knobs || Object.keys(d.rounds[0].envs[0] || {}).filter(k => typeof d.rounds[0].envs[0][k] === 'boolean');
  d.space = d.space || 2 ** d.knobs.length;
  d.trigger = d.trigger || []; d.irrelevant = d.irrelevant || [];
  return d;
}
const worldIndex = e => data.knobs.reduce((n, k) => n * 2 + (e[k] ? 1 : 0), 0);

/* ---- build ---- */
function build() {
  const rounds = $('rounds'); rounds.textContent = '';
  tiles = {};
  const cols = Math.max(...data.rounds.map(r => r.envs.length), 1);
  $('wrap').classList.toggle('dense', data.rounds.length > 6);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'links'); rounds.appendChild(svg);
  data.rounds.forEach(r => {
    const row = el('div', 'round'); row.dataset.phase = r.phase;
    const lab = el('div', 'rlabel'); lab.append(el('b', '', 'ROUND ' + r.round), el('span', '', String(r.phase).toUpperCase()));
    const box = el('div', 'tiles'); box.style.setProperty('--cols', cols);
    r.envs.forEach(e => {
      const t = el('article', 'tile'); t.tabIndex = 0; t.title = e.reason + (e.evidence ? '  [evidence: ' + e.evidence + ']' : '');
      const head = el('div', 'thead'); const how = el('span', 'how');
      if (e.flipped) { how.append('flip ', el('b', '', e.flipped)); } else how.textContent = 'random';
      if (e.source === 'cached') how.append(' (cached)');
      head.append(el('span', 'tid', e.id), how);
      const bar = el('div', 'bar'); for (let i = 0; i < 5; i++) bar.appendChild(el('i'));
      const knobs = el('div', 'knobs');
      data.knobs.forEach(k => { const c = el('i', e[k] ? 'onk' : '', SHORT[k] || k.slice(0, 4).toUpperCase()); if (k === e.flipped) c.classList.add('flip'); c.title = k + (e[k] ? ' ON' : ' OFF'); knobs.appendChild(c); });
      t.append(head, bar, knobs);
      t.addEventListener('mouseenter', () => say(e)); t.addEventListener('focus', () => say(e));
      box.appendChild(t); tiles[e.id] = { t, bar, e, row };
    });
    row.append(lab, box); rounds.appendChild(row); r._row = row;
  });
  const map = $('map'); map.textContent = '';
  for (let i = 0; i < data.space; i++) map.appendChild(el('i'));
  $('space').textContent = data.space;
  $('rname').textContent = 'TOOL: ' + String(data.profile || 'under test').toUpperCase();
  if (data.profile_desc) $('tag').textContent = 'Tool under test ' + data.profile_desc + '.';
}
function say(e, cls) {
  const c = $('caption'); c.className = 'caption' + (cls ? ' ' + cls : (e.score === 5 ? ' bad' : ''));
  c.textContent = e.id + '  ' + (e.flipped ? 'flip ' + e.flipped : 'random world') + ':  ' + e.reason;
}
function link(child) {
  const p = tiles[child.e.parent]; if (!p) return;
  const base = $('rounds').getBoundingClientRect(), a = p.t.getBoundingClientRect(), b = child.t.getBoundingClientRect();
  const x1 = a.left + a.width / 2 - base.left, y1 = a.bottom - base.top, x2 = b.left + b.width / 2 - base.left, y2 = b.top - base.top;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'), my = (y1 + y2) / 2;
  path.setAttribute('d', `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
  path.setAttribute('class', 'on' + (child.e.score === 5 ? ' bad' : ''));
  $('rounds').querySelector('svg.links').appendChild(path);
}
function chip(box, text, no) {
  if ([...$(box).children].some(c => c.textContent === text)) return;
  $(box).appendChild(el('span', 'chip' + (no ? ' no' : ''), text));
}
function setMeter(n) {
  [...$('meter').children].forEach((s, i) => s.style.background = i < n ? SCORE_COLOR[n] : '');
  $('meterN').textContent = n + '/5';
}

/* ---- play ---- */
async function play() {
  const token = ++runToken, alive = () => token === runToken;
  const seen = new Set(); let best = 0;
  ['fg', 'fr'].forEach(f => $(f).classList.remove('ko', 'win', 'tired'));
  $('trig').textContent = ''; $('irr').textContent = ''; $('late').classList.remove('on');
  $('rounds').querySelector('svg.links').textContent = '';
  [...$('map').children].forEach(c => { c.style.background = ''; c.className = ''; });
  Object.values(tiles).forEach(({ t, bar }) => { t.className = 'tile'; [...bar.children].forEach(s => s.style.background = ''); });
  data.rounds.forEach(r => r._row.classList.remove('on'));
  setMeter(0); $('tested').textContent = '0'; $('caption').textContent = ''; $('caption').className = 'caption';
  const scene = data.crime_scene && data.crime_scene.clone;

  for (const r of data.rounds) {
    if (!alive()) return;
    r._row.classList.add('on');
    const ph = $('phase'); ph.textContent = String(r.phase).toUpperCase();
    ph.appendChild(el('small', '', 'ROUND ' + r.round + (r.phase === 'shrink' ? '  switch one condition off at a time' : r.phase === 'climb' ? '  fork the best world, flip one condition' : r.phase === 'explore' ? '  random worlds' : '')));
    if (!instant) r._row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    await sleep(380);
    for (const e of r.envs) {
      if (!alive()) return;
      const { t, bar } = tiles[e.id];
      t.classList.add('on', e.score === 5 ? 's5' : 'safe'); if (e.id === scene) t.classList.add('scene');
      [...bar.children].forEach((s, i) => { if (i < e.score) s.style.background = SCORE_COLOR[e.score]; });
      link(tiles[e.id]); say(e);
      const cell = $('map').children[worldIndex(e)];
      if (cell) { cell.style.background = e.score ? SCORE_COLOR[e.score] : '#2c5a41'; if (e.id === scene) cell.classList.add('scene'); }
      seen.add(worldIndex(e)); $('tested').textContent = seen.size;
      if (e.score > best) { best = e.score; setMeter(best); }
      if (r.phase === 'shrink') {
        const k = e.flipped;
        if (e.score < 5) { act('fg', 'jab'); setTimeout(() => act('fr', 'hit'), 140); chip('trig', data.trigger.find(x => x === k || x === 'no ' + k) || k); }
        else { act('fg', 'jab'); act('fr', 'block'); chip('irr', k, true); }
      } else if (e.score === 5) {
        act('fr', 'lunge', 600); setTimeout(() => { act('fg', 'hit'); if (!instant) { $('arena').classList.remove('flash'); void $('arena').offsetWidth; $('arena').classList.add('flash'); } }, 190);
      } else if (e.score >= 3) { act('fr', 'jab'); setTimeout(() => act('fg', 'block'), 140); }
      else if (e.score >= 1) { act('fg', 'block', 340); }
      await sleep(e.score === 5 && r.phase !== 'shrink' ? 900 : 230);
    }
    await sleep(260);
  }
  if (!alive()) return;
  finish();
}
function finish() {
  const found = data.trigger.length > 0 || data.betrayed > 0;
  data.trigger.forEach(x => chip('trig', x)); data.irrelevant.forEach(x => chip('irr', x, true));
  const ph = $('phase'), cap = $('caption'), v = $('verdict');
  const n = data.unique_worlds_tested ?? Number($('tested').textContent);
  $('tested').textContent = n;
  if (found) {
    ph.textContent = 'TRIGGER PINNED'; cap.className = 'caption good';
    cap.textContent = 'Airlock caught it after ' + n + ' of ' + data.space + ' worlds.';
    $('fr').classList.add('ko'); $('fg').classList.add('win');
    v.className = 'verdict'; v.textContent = 'Found the betrayal after testing ' + n + ' of ' + data.space + ' worlds.';
  } else {
    ph.textContent = 'NO BETRAYAL'; cap.className = 'caption good';
    cap.textContent = 'Searched ' + n + ' of ' + data.space + ' worlds. The tool never leaked.';
    $('fr').classList.add('tired'); $('fg').classList.add('win');
    v.className = 'verdict safe'; v.textContent = 'No betrayal in ' + n + ' worlds. This tool held.';
    if (!$('trig').children.length) $('trig').appendChild(el('span', 'chip none', 'nothing found'));
  }
  const facts = $('facts'); facts.textContent = '';
  const row = (...parts) => { const p = el('div'); p.append(...parts); facts.appendChild(p); };
  if (data.mode === 'archil') row(el('b', '', (data.sandboxes_forked ?? n) + ' real Archil microVM forks'), data.seconds ? ' in ' + data.seconds + 's' : '');
  else row('Local run', data.sandboxes_forked ? ', ' + data.sandboxes_forked + ' clones' : '');
  if (data.note) row(el('span', 'warn', data.note));
  const ev = data.evidence;
  if (ev) row('Evidence disk: grep ', el('code', '', ev.canary || 'BAIT-'), ' found ' + (ev.grep_hits || []).length + ' leaked lines in ' + (ev.grep_runs || []).length + ' clones. ',
    el('span', ev.agrees_with_judge ? 'ok' : 'warn', ev.agrees_with_judge ? 'Agrees with the judge.' : 'Does not match the judge.'));
  const cs = data.crime_scene;
  if (cs) row(el('b', '', 'Crime scene kept: '), 'world ' + cs.clone + (cs.sandbox_id ? ', microVM ' + String(cs.sandbox_id).slice(0, 8) + ' paused. ' : '. '), 'Ask what if: ', el('code', '', 'python3 demo.py whatif network'));
  $('late').classList.add('on');
}

/* ---- load ---- */
async function load(which) {
  current = which; runToken++;
  [...$('keys').children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === which)));
  try {
    const url = which === '0' ? './results.json' : './demo_results/' + which + '.json';
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('Could not load ' + url + ' (HTTP ' + res.status + ').');
    data = normalize(await res.json());
    build(); await play();
  } catch (err) {
    const box = $('rounds'); box.textContent = '';
    const s = el('div', 'state'); s.append(err.message, el('br'), 'Run ', el('code', '', 'python3 run_airlock.py'), ' then serve this folder: ', el('code', '', 'python3 -m http.server 8000 --bind 127.0.0.1'));
    box.appendChild(s); $('phase').textContent = 'NO RESULTS';
  }
}
async function setupKeys() {
  const keys = $('keys'); const add = (k, label, title) => { const b = el('button', 'key', label); b.dataset.k = k; b.title = title; b.setAttribute('aria-pressed', 'false'); b.onclick = () => load(k); keys.appendChild(b); };
  add('0', 'Latest', 'Latest run (0)');
  const names = { 1: 'The trap', 2: 'Obeys anything', 3: 'Real model', 4: 'Safe tool' };
  await Promise.all(Object.keys(names).map(async k => {
    try { const r = await fetch('./demo_results/' + k + '.json', { method: 'HEAD', cache: 'no-store' }); if (r.ok) names[k] = [names[k]]; } catch (e) { /* not generated */ }
  }));
  Object.entries(names).forEach(([k, v]) => { if (Array.isArray(v)) add(k, k + ' ' + v[0], 'Scenario ' + k + ' (' + k + ')'); });
}
$('replay').onclick = () => { instant = params.has('instant') || reduce; if (data) play(); };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r') $('replay').click();
  else if (k === 's' && data) { instant = true; play().then(() => { instant = params.has('instant') || reduce; }); }
  else if (/^[0-4]$/.test(k) && [...$('keys').children].some(b => b.dataset.k === k)) load(k);
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (data) { const keep = instant; instant = true; play().then(() => { instant = keep; }); } }, 200); });
setupKeys().then(() => load(params.get('run') || '0'));
</script>
